global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: nexus-os
scrape_configs:
  - job_name: nexus-core
    static_configs:
      - targets: ['nexus-core:3000']
    metrics_path: /api/metrics
  - job_name: qdrant
    static_configs:
      - targets: ['qdrant:6333']
    metrics_path: /metrics
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
