<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nexus OS Marketplace - Unified Multi-Vendor Engine</title>
    <!-- SEO Meta Tags -->
    <meta name="description" content="Nexus OS Marketplace is a revolutionary AI-powered multi-vendor platform with global scale and 3D product previews." />
    <meta name="keywords" content="e-commerce, multi-vendor, AI shopping, 3D products, unified engine" />
    <meta property="og:title" content="Nexus OS Marketplace" />
    <meta property="og:description" content="AI-driven multi-vendor storefronts and offline-first autonomous business." />
    <meta property="og:type" content="website" />
    <meta name="robots" content="index, follow" />
    
    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Nexus OS Marketplace",
      "url": "https://nexusos.com/",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://nexusos.com/store/global?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
